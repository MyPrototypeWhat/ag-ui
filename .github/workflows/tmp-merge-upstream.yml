name: Merge upstream main into vercel-ai-sdk-v6

on:
  push:
    branches:
      - claude/tmp-merge-upstream-workflow
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vercel-ai-sdk-v6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge upstream/main and resolve generated files.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # LFS objects are not hydrated in this checkout; keep pointers as-is
          # and normalize the worktree so merge doesn't see phantom changes.
          git lfs install --local --skip-smudge || true
          git reset --hard HEAD
          git status --short

          git remote add upstream https://github.com/ag-ui-protocol/ag-ui
          git fetch upstream main

          if git merge upstream/main --no-edit; then
            echo "Clean merge, no conflicts."
          else
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicting files:"
            echo "$conflicts"
            if [ "$conflicts" != "apps/dojo/src/files.json" ]; then
              echo "Unexpected merge failure or conflicts beyond generated files.json — aborting."
              git status
              git merge --abort || true
              exit 1
            fi
            # files.json is generated from the repo contents; regenerate it
            # from the merged tree instead of hand-resolving markers.
            (cd apps/dojo && npx -y tsx scripts/generate-content-json.ts)
            git add apps/dojo/src/files.json
            git commit --no-edit
          fi

          git push origin feat/vercel-ai-sdk-v6
