name: Merge upstream main into vercel-ai-sdk-v6

on:
  push:
    branches:
      - claude/tmp-merge-upstream-workflow
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vercel-ai-sdk-v6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge upstream/main and resolve generated files.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Neutralize the LFS filter entirely: we merge pointer text as plain
          # files and never need the hydrated binaries. This prevents phantom
          # "modified" LFS files from blocking the merge.
          git config filter.lfs.smudge cat
          git config filter.lfs.clean cat
          git config filter.lfs.process ""
          git config filter.lfs.required false
          git checkout-index -f -a
          git update-index --refresh || true

          if [ -n "$(git status --porcelain)" ]; then
            echo "Worktree still dirty after normalization:"
            git status
            exit 1
          fi

          git remote add upstream https://github.com/ag-ui-protocol/ag-ui
          git fetch upstream main

          if git merge upstream/main --no-edit; then
            echo "Clean merge, no conflicts."
          else
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicting files:"
            echo "$conflicts"
            if [ "$conflicts" != "apps/dojo/src/files.json" ]; then
              echo "Unexpected merge failure or conflicts beyond generated files.json — aborting."
              git status
              git merge --abort || true
              exit 1
            fi
            # files.json is generated from the repo contents; regenerate it
            # from the merged tree instead of hand-resolving markers.
            (cd apps/dojo && npx -y tsx scripts/generate-content-json.ts)
            git add apps/dojo/src/files.json
            git commit --no-edit
          fi

          # GITHUB_TOKEN cannot push changes under .github/workflows. Strip
          # those changes from the merge commit (restore the branch's previous
          # versions); they are re-applied afterwards via the GitHub API.
          git rm -r -f -q --ignore-unmatch .github/workflows
          git checkout ORIG_HEAD -- .github/workflows
          git add .github/workflows
          git commit --amend --no-edit

          git push origin feat/vercel-ai-sdk-v6
